function stmt(sql, args = []) {
  const exec = () => {
    const s = sqlite.prepare(sql);
    s.bind(args);
    const rows = [];
    while (s.step()) rows.push(s.getAsObject());
    s.free();
    return { results: rows, meta: { changes: sqlite.getRowsModified() } };
  };
  return {
    bind: (...values) => stmt(sql, values),
    run: async () => exec(),
    all: async () => exec(),
    first: async (col) => { const row = exec().results[0]; return row ? (col ? row[col] : row) : null; },
    _exec: exec,
  };
}

const publicJwk = { ...(await crypto.subtle.exportKey('jwk', pair.publicKey)), kid: 'k1', alg: 'RS256', use: 'sig' };
const enc = (obj) => btoa(JSON.stringify(obj)).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
async function idToken(claims, key = pair.privateKey) {
  const head = enc({ alg: 'RS256', kid: 'k1', typ: 'JWT' });
  const body = enc({ iss: 'https://accounts.google.com', aud: env.GOOGLE_CLIENT_ID, exp: Math.floor(Date.now() / 1000) + 600, sub: '123', email: 'pessoa@teste.invalid', email_verified: true, ...claims });
  const sig = new Uint8Array(await crypto.subtle.sign('RSASSA-PKCS1-v1_5', key, new TextEncoder().encode(`${head}.${body}`)));
  return `${head}.${body}.${btoa(String.fromCharCode(...sig)).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '')}`;
}
const driveFiles = new Map();
let driveSeq = 0;
const googleCalls = [];
const prevFetch = window.fetch;
window.fetch = async (url, init = {}) => {
  const u = String(url);
  if (u === 'https://www.googleapis.com/oauth2/v3/certs') return new Response(JSON.stringify({ keys: [publicJwk] }));
  if (u === 'https://oauth2.googleapis.com/token') {
    const params = new URLSearchParams(init.body);
    googleCalls.push(params.get('grant_type'));
    if (params.get('client_secret') !== 'segredo-de-teste') return new Response(JSON.stringify({ error: 'invalid_client' }), { status: 401 });
    return new Response(JSON.stringify({ access_token: 'acesso', expires_in: 3600, refresh_token: params.get('grant_type') === 'authorization_code' ? 'renovar' : undefined, id_token: `${enc({})}.${enc({ email: 'pessoa@teste.invalid' })}.x` }));
  }
  if (u.startsWith('https://oauth2.googleapis.com/revoke')) return new Response('{}');
  if (u.startsWith('https://www.googleapis.com/drive/v3/files') || u.startsWith('https://www.googleapis.com/upload/drive/v3/files')) {
    const method = (init.method || 'GET').toUpperCase();
    const parsed = new URL(u);
    const id = parsed.pathname.split('/files/')[1];
    if (method === 'GET' && !id) {
      const q = parsed.searchParams.get('q');
      const name = (q.match(/name = '([^']+)'/) || [])[1];
      const files = [...driveFiles.values()].filter((f) => (!name || f.name === name) && (!q.includes('folder') || f.folder) && (!q.includes("contains 'afazeres-backup-'") || f.name.startsWith('afazeres-backup-')))
        .sort((a, b) => b.name.localeCompare(a.name));
      return new Response(JSON.stringify({ files }));
    }
    if (method === 'GET' && id) {
      const f = driveFiles.get(id);
      if (!f) return new Response('{}', { status: 404 });
      return new Response(parsed.searchParams.get('alt') === 'media' ? f.content : JSON.stringify({ id, trashed: false }));
    }
    if (method === 'DELETE') { driveFiles.delete(id); return new Response(null, { status: 204 }); }
    if (method === 'POST' && !u.includes('upload')) {
      const meta = JSON.parse(init.body);
      const fid = `pasta${(driveSeq += 1)}xxxxxxxx`;
      driveFiles.set(fid, { id: fid, name: meta.name, folder: true });
      return new Response(JSON.stringify({ id: fid }));
    }
    const parts = String(init.body).split(/--b[0-9a-f]+/);
    const meta = JSON.parse(parts[1].split('\r\n\r\n')[1]);
    const content = parts[2].split('\r\n\r\n')[1].replace(/\r\n$/, '');
    const fid = id ? id.split('?')[0] : `arq${(driveSeq += 1)}xxxxxxxxxx`;
    driveFiles.set(fid, { id: fid, name: meta.name || driveFiles.get(fid)?.name, content });
    return new Response(JSON.stringify({ id: fid }));
  }
  return prevFetch(url, init);
};

{

await call('/drive/disconnect', {}, token);
check('Drive: desconectar apaga a autorização', (await call('/google/status', {}, token)).body.drive === null);
await call('/google/unlink', {}, token);
check('Google: desligar impede entrar com Google', (await call('/google/login', { credential: await idToken({}) })).status === 401);
window.fetch = prevFetch;

// ---------- v30: alarmes do app Android ----------
{
  sqlite.run('CREATE TABLE IF NOT EXISTS counter (seq INTEGER); INSERT INTO counter SELECT 10 WHERE NOT EXISTS (SELECT 1 FROM counter);');
  const pad2 = (n) => String(n).padStart(2, '0');
  // Celular no horário de Brasília (UTC−3), como o Android informa: −180 minutos.
  const OFFSET = -180;
  const devWall = (ms = Date.now()) => new Date(ms + OFFSET * 60000);
  const devDate = (d) => `${d.getUTCFullYear()}-${pad2(d.getUTCMonth() + 1)}-${pad2(d.getUTCDate())}`;
  const today = devDate(devWall());
  const tomorrow = devDate(devWall(Date.now() + 86400000));
  const tokA = (await callUA('/login', { login: 'teste-descartavel', proof }, null, PHONE_UA)).body.token;
  const tokB = (await call('/login', { login: 'teste-descartavel', proof })).body.token;
  const epA = 'https://fcm.googleapis.com/fcm/send/celularA';
  const epB = 'https://fcm.googleapis.com/fcm/send/celularB';
  await call('/push/subscribe', { endpoint: epA }, tokA);
  await call('/push/subscribe', { endpoint: epB }, tokB);

  check('alarmes: sem sessão, não gera código', (await call('/alarms/pair', {})).status === 401);
  const code = (await call('/alarms/pair', { endpoint: epA }, tokA)).body.code;
  check('alarmes: código de uso único gerado', /^[0-9a-f]{32}$/.test(code || ''));
  const claim = await call('/alarms/claim', { code, name: 'SM-A556E' });
  const dev = claim.body.token;
  check('alarmes: o celular troca o código pela chave', claim.status === 200 && /^[0-9a-f]{64}$/.test(dev || ''));
  check('alarmes: o código não vale duas vezes', (await call('/alarms/claim', { code, name: 'x' })).status === 400);
  check('alarmes: chave errada não lê a agenda', (await call('/alarms/list', {}, 'f'.repeat(64))).status === 401);
  check('alarmes: a chave do celular não serve como sessão', (await call('/push/state', {}, dev)).status === 401);

  const item = (key, at, extra = {}) => ({ key, at, taskId: key.split('|')[0], kind: 'remind', title: key, body: 'b', ...extra });
  await call('/push/schedule', { since: 100, items: [item('al1|x|0', Date.now() + 120000), item('al2|x|0', Date.now() + 5 * 86400000)] }, tokA);
  const covered = () => sql1("SELECT COUNT(*) FROM alarm_covered")[0][0];
  const l0 = await call('/alarms/list', { exact: true, notify: false }, dev);
  check('alarmes: agenda só dos próximos 3 dias (o teste de aviso também vira alarme)', l0.body.items?.filter((i) => i.kind !== 'test').map((i) => i.key).join() === 'al1|x|0');
  check('alarmes: sem notificação liberada no Android, não conta como agendado', l0.body.ready === false && covered() === 0);
  const l1 = await call('/alarms/list', { exact: true, notify: true }, dev);
  check('alarmes: com tudo liberado, o servidor anota o que o celular agendou', l1.body.ready === true && covered() === l1.body.items.length && l1.body.items.length >= 1);
  const st = await call('/alarms/status', {}, tokA);
  check('alarmes: o app web vê os alarmes ativos neste celular', st.body.active === true && st.body.ready === true && st.body.name === 'SM-A556E');
  check('alarmes: o outro celular continua sem alarmes', (await call('/alarms/status', {}, tokB)).body.active === false);
  check('alarmes: aviso ainda na fila vale', (await call('/alarms/check', { key: 'al1|x|0' }, dev)).body.valid === true);
  check('alarmes: aviso que saiu da fila não toca', (await call('/alarms/check', { key: 'sumiu|x|0' }, dev)).body.valid === false);

  sqlite.run("UPDATE push_queue SET at = ? WHERE key = 'al1|x|0'", [Date.now() - 1000]);
  pushed.length = 0;
  await cron();
  check('alarmes: o celular com o alarme agendado não recebe o push; o outro recebe',
    pushed.some((p) => p.url === epB) && !pushed.some((p) => p.url === epA));
  check('alarmes: /push/due não repete no celular com alarme', (await call('/push/due', { endpoint: epA })).body.items.every((i) => i.key !== 'al1|x|0'));
  check('alarmes: /push/due traz o aviso no outro celular', (await call('/push/due', { endpoint: epB })).body.items.some((i) => i.key === 'al1|x|0'));
  await call('/push/schedule', { since: 100, items: [item('al3|x|0', Date.now() - 1000)] }, tokA);
  pushed.length = 0;
  await cron();
  check('alarmes: aviso novo, que o celular ainda não agendou, vai por push', pushed.some((p) => p.url === epA));

  // Botões da notificação, com o relógio do celular.
  const putTask = (task) => sqlite.run("INSERT OR REPLACE INTO items VALUES ('tasks', ?, ?, 0, 5)", [task.id, JSON.stringify({ ...task, _t: Object.fromEntries(Object.keys(task).map((k) => [k, 1])) })]);
  const getTask = (id) => JSON.parse(sql1(`SELECT data FROM items WHERE kind = 'tasks' AND id = '${id}'`)[0][0]);
  const base = { title: 'Tarefa', status: 'open', listId: 'inbox', order: 0, notes: '', steps: [], tags: [] };
  putTask({ ...base, id: 'act1', when: today, remindAt: `${today}T08:00` });
  const seq0 = sql1('SELECT seq FROM counter')[0][0];
  const a1 = await call('/alarms/act', { taskId: 'act1', action: 'done', offset: OFFSET }, dev);
  const t1 = getTask('act1');
  check('ações: Concluir sem abrir o app', a1.body.ok === true && t1.status === 'done');
  check('ações: a hora da conclusão é a real (não a deslocada)', Math.abs(Date.parse(t1.completedAt) - Date.now()) < 10000);
  check('ações: a mudança vai para os outros aparelhos', sql1('SELECT seq FROM counter')[0][0] === seq0 + 1 && t1._t.status > 1000);
  putTask({ ...base, id: 'act2', when: today, remindAt: `${today}T08:00` });
  await call('/alarms/act', { taskId: 'act2', action: 'tomorrow', offset: OFFSET }, dev);
  const t2 = getTask('act2');
  const at2 = sql1("SELECT at FROM push_queue WHERE task_id = 'act2' AND sent_at IS NULL")[0]?.[0];
  const [ty, tm, td] = tomorrow.split('-').map(Number);
  check('ações: Amanhã leva o dia e o lembrete para amanhã, no horário do celular', t2.when === tomorrow && t2.remindAt === `${tomorrow}T08:00`);
  check('ações: o aviso novo entra na fila no instante certo (08:00 de Brasília = 11:00 UTC)', at2 === Date.UTC(ty, tm - 1, td, 11, 0));
  putTask({ ...base, id: 'act3', when: today, remindAt: `${today}T00:00` });
  await call('/alarms/act', { taskId: 'act3', action: 'snooze', offset: OFFSET }, dev);
  const t3 = getTask('act3');
  const expect3 = devWall(Date.now() + 10 * 60000);
  const expected3 = `${devDate(expect3)}T${pad2(expect3.getUTCHours())}:${pad2(expect3.getUTCMinutes())}`;
  check('ações: Adiar 10 min no horário do celular', t3.snoozedUntil === expected3 || t3.snoozedUntil > expected3.slice(0, 15));
  putTask({ ...base, id: 'act4', when: today, remindAt: `${today}T08:00`, repeat: { freq: 'daily', interval: 1, anchor: today } });
  await call('/alarms/act', { taskId: 'act4', action: 'done', offset: OFFSET }, dev);
  const t4 = getTask('act4');
  const log4 = sql1("SELECT data FROM items WHERE kind = 'log'").map((r) => JSON.parse(r[0])).find((l) => l.taskId === 'act4');
  check('ações: Concluir numa repetição vai para a próxima e registra no histórico', t4.status === 'open' && t4.when === tomorrow && !!log4 && Math.abs(Date.parse(log4.completedAt) - Date.now()) < 10000);
  check('ações: tarefa que não existe mais não quebra', (await call('/alarms/act', { taskId: 'nada', action: 'done', offset: OFFSET }, dev)).body.ok === false);
  check('ações: ação desconhecida recusada', (await call('/alarms/act', { taskId: 'act4', action: 'apagar', offset: OFFSET }, dev)).status === 400);

  await call('/alarms/revoke', {}, tokA);
  check('alarmes: desligar no app web apaga a chave', (await call('/alarms/list', {}, dev)).status === 401 && covered() === 0);
  const code2 = (await call('/alarms/pair', { endpoint: epA }, tokA)).body.code;
  const dev2 = (await call('/alarms/claim', { code: code2, name: 'SM-A556E' })).body.token;
  check('alarmes: parear de novo funciona', (await call('/alarms/list', { exact: true, notify: true }, dev2)).status === 200);
  await call('/logout', {}, tokA);
  check('alarmes: sair do aparelho corta os alarmes dele', (await call('/alarms/list', {}, dev2)).status === 401 && sql1('SELECT COUNT(*) FROM alarm_devices')[0][0] === 0);
  const old = sql1('SELECT COUNT(*) FROM alarm_codes')[0][0];
  sqlite.run('UPDATE alarm_codes SET expires = 1');
  const code3 = (await call('/alarms/pair', {}, tokB)).body.code;
  sqlite.run('UPDATE alarm_codes SET expires = 1');
  check('alarmes: código vencido recusado', (await call('/alarms/claim', { code: code3, name: 'x' })).status === 400 && old >= 0);
}

// ---------- v34: notificação resolvida num aparelho sai dos outros ----------
{
  sqlite.run('DELETE FROM push_queue');
  const pad2 = (n) => String(n).padStart(2, '0');
  const OFFSET = -180;
  const devWall = (ms = Date.now()) => new Date(ms + OFFSET * 60000);
  const today = `${devWall().getUTCFullYear()}-${pad2(devWall().getUTCMonth() + 1)}-${pad2(devWall().getUTCDate())}`;
  const login = async () => (await call('/login', { login: 'teste-descartavel', proof })).body.token;
  const tokP = await login();
  const tokQ = await login();
  const tokN = await login();
  const epP = 'https://fcm.googleapis.com/fcm/send/limparP';
  const epQ = 'https://fcm.googleapis.com/fcm/send/limparQ';
  const epN = 'https://fcm.googleapis.com/fcm/send/limparN';
  await call('/push/subscribe', { endpoint: epP, clear: true }, tokP);
  await call('/push/subscribe', { endpoint: epQ }, tokQ);
  await call('/push/due', { endpoint: epQ, clear: true }); // o service worker novo também marca
  await call('/push/subscribe', { endpoint: epN }, tokN); // aparelho com o app antigo
  const rung = (taskId, ago = 60000) => sqlite.run("INSERT OR REPLACE INTO push_queue (key, at, sent_at, task_id, kind, title, body) VALUES (?, ?, ?, ?, 'remind', 'T', 'b')",
    [`${taskId}|x|0`, Date.now() - ago, Date.now() - ago + 18000, taskId]);
  const clears = () => sql1("SELECT task_id FROM push_queue WHERE kind = 'clear' ORDER BY task_id").map((r) => r[0]);
  rung('c1'); rung('c2'); rung('c3');
  rung('velha', 13 * 3600000);
  sqlite.run("INSERT INTO push_queue (key, at, task_id, kind, title, body) VALUES ('futura|x|0', ?, 'futura', 'remind', 'T', 'b')", [Date.now() + 3600000]);

  await call('/push/schedule', { since: 1000, items: [], due: ['c3'], now: Date.now() }, tokP);
  check('limpar: o que tocou e não está mais pendente é anotado para limpar', clears().join() === 'c1,c2');
  await call('/push/schedule', { since: 1000, items: [], due: ['c3'], now: Date.now() }, tokP);
  check('limpar: enviar a agenda de novo não repete', clears().length === 2);
  await call('/push/schedule', { since: 1000, items: [], now: Date.now() }, tokP);
  check('limpar: app antigo (sem a lista de pendentes) não limpa nada', clears().length === 2);
  await call('/push/schedule', { since: 1000, items: [], due: [], now: Date.now() - 10 * 60000 }, tokP);
  check('limpar: só o que tocou até a hora em que o aparelho olhou', !clears().includes('c3'));

  pushed.length = 0;
  await cron();
  const to = (ep) => pushed.some((p) => p.url === ep);
  check('limpar: o aviso vai para o outro aparelho', to(epQ));
  check('limpar: não vai para o aparelho que resolveu', !to(epP));
  check('limpar: não vai para o aparelho com o app antigo', !to(epN));
  const dueQ = (await call('/push/due', { endpoint: epQ, clear: true })).body.items;
  check('limpar: o service worker novo recebe quais tarefas limpar, sem texto', dueQ.filter((i) => i.kind === 'clear').map((i) => i.taskId).sort().join() === 'c1,c2'
    && dueQ.every((i) => i.kind !== 'clear' || (!i.title && !i.body && i.at > 0)));
  check('limpar: o service worker antigo não recebe aviso de limpar', (await call('/push/due', { endpoint: epN })).body.items.every((i) => i.kind !== 'clear'));

  rung('c4');
  await call('/push/schedule', { since: 1001, items: [], due: ['c3'], now: Date.now() }, tokP);
  await call('/push/schedule', { since: 1002, items: [], due: ['c3', 'c4'], now: Date.now() }, tokQ);
  check('limpar: uma agenda nova não apaga o aviso de limpar ainda não enviado', clears().includes('c4'));
  check('limpar: a agenda nova continua substituindo os lembretes futuros (como antes)', sql1("SELECT COUNT(*) FROM push_queue WHERE kind = 'remind' AND sent_at IS NULL")[0][0] === 0);

  rung('c5');
  await call('/push/task', { taskId: 'c5', items: [], due: false, now: Date.now() }, tokQ);
  check('limpar: botão da notificação do site (/push/task) limpa a tarefa', clears().includes('c5'));
  rung('c7');
  await call('/push/task', { taskId: 'c7', items: [], due: true, now: Date.now() }, tokQ);
  check('limpar: tarefa que continua pendente não é limpa', !clears().includes('c7'));

  // Alarme do Android: o servidor resolve e limpa nos outros, menos no próprio celular.
  const code = (await call('/alarms/pair', { endpoint: epQ }, tokQ)).body.code;
  const dev = (await call('/alarms/claim', { code, name: 'SM-A556E' })).body.token;
  const list = await call('/alarms/list', { exact: true, notify: true }, dev);
  check('limpar: a agenda dos alarmes nunca traz aviso de limpar', list.status === 200 && list.body.items.every((i) => i.kind !== 'clear'));
  sqlite.run("INSERT OR REPLACE INTO items VALUES ('tasks', 'c6', ?, 0, 5)", [JSON.stringify({ id: 'c6', title: 'Remédio', status: 'open', listId: 'inbox', order: 0, notes: '', steps: [], tags: [], when: today, remindAt: `${today}T00:00`, _t: { title: 1 } })]);
  rung('c6');
  await call('/alarms/act', { taskId: 'c6', action: 'done', offset: OFFSET }, dev);
  const row6 = sql1("SELECT body FROM push_queue WHERE kind = 'clear' AND task_id = 'c6'")[0];
  check('limpar: Concluir no alarme do Android anota a limpeza', !!row6);
  sqlite.run("UPDATE push_queue SET sent_at = 1 WHERE kind = 'clear' AND task_id <> 'c6'");
  pushed.length = 0;
  await cron();
  check('limpar: o celular do alarme não recebe; o outro aparelho recebe', to(epP) && !to(epQ));
  await call('/alarms/revoke', {}, tokQ);
  await Promise.all([tokP, tokQ, tokN].map((t) => call('/logout', {}, t)));
}

lines.push(`\nCron (no navegador, só referência): ${cronMs.toFixed(1)} ms no total, incluindo esperas`);
const failed = lines.filter((l) => l.startsWith('FALHA')).length;
document.title = failed ? `FALHOU ${failed}` : 'OK servidor';
document.getElementById('out').textContent = lines.join('\n');
</script>
</body>
