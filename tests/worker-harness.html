function stmt(sql, args = []) {
  const exec = () => {
    const s = sqlite.prepare(sql);
    s.bind(args);
    const rows = [];
    while (s.step()) rows.push(s.getAsObject());
    s.free();
    return { results: rows, meta: { changes: sqlite.getRowsModified() } };
  };
  return {
    bind: (...values) => stmt(sql, values),
    run: async () => exec(),
    all: async () => exec(),
    first: async (col) => { const row = exec().results[0]; return row ? (col ? row[col] : row) : null; },
    _exec: exec,
  };
}

const publicJwk = { ...(await crypto.subtle.exportKey('jwk', pair.publicKey)), kid: 'k1', alg: 'RS256', use: 'sig' };
const enc = (obj) => btoa(JSON.stringify(obj)).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
async function idToken(claims, key = pair.privateKey) {
  const head = enc({ alg: 'RS256', kid: 'k1', typ: 'JWT' });
  const body = enc({ iss: 'https://accounts.google.com', aud: env.GOOGLE_CLIENT_ID, exp: Math.floor(Date.now() / 1000) + 600, sub: '123', email: 'pessoa@teste.invalid', email_verified: true, ...claims });
  const sig = new Uint8Array(await crypto.subtle.sign('RSASSA-PKCS1-v1_5', key, new TextEncoder().encode(`${head}.${body}`)));
  return `${head}.${body}.${btoa(String.fromCharCode(...sig)).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '')}`;
}
const driveFiles = new Map();
let driveSeq = 0;
const googleCalls = [];
const prevFetch = window.fetch;
window.fetch = async (url, init = {}) => {
  const u = String(url);
  if (u === 'https://www.googleapis.com/oauth2/v3/certs') return new Response(JSON.stringify({ keys: [publicJwk] }));
  if (u === 'https://oauth2.googleapis.com/token') {
    const params = new URLSearchParams(init.body);
    googleCalls.push(params.get('grant_type'));
    if (params.get('client_secret') !== 'segredo-de-teste') return new Response(JSON.stringify({ error: 'invalid_client' }), { status: 401 });
    return new Response(JSON.stringify({ access_token: 'acesso', expires_in: 3600, refresh_token: params.get('grant_type') === 'authorization_code' ? 'renovar' : undefined, id_token: `${enc({})}.${enc({ email: 'pessoa@teste.invalid' })}.x` }));
  }
  if (u.startsWith('https://oauth2.googleapis.com/revoke')) return new Response('{}');
  if (u.startsWith('https://www.googleapis.com/drive/v3/files') || u.startsWith('https://www.googleapis.com/upload/drive/v3/files')) {
    const method = (init.method || 'GET').toUpperCase();
    const parsed = new URL(u);
    const id = parsed.pathname.split('/files/')[1];
    if (method === 'GET' && !id) {
      const q = parsed.searchParams.get('q');
      const name = (q.match(/name = '([^']+)'/) || [])[1];
      const files = [...driveFiles.values()].filter((f) => (!name || f.name === name) && (!q.includes('folder') || f.folder) && (!q.includes("contains 'afazeres-backup-'") || f.name.startsWith('afazeres-backup-')))
        .sort((a, b) => b.name.localeCompare(a.name));
      return new Response(JSON.stringify({ files }));
    }
    if (method === 'GET' && id) {
      const f = driveFiles.get(id);
      if (!f) return new Response('{}', { status: 404 });
      return new Response(parsed.searchParams.get('alt') === 'media' ? f.content : JSON.stringify({ id, trashed: false }));
    }
    if (method === 'DELETE') { driveFiles.delete(id); return new Response(null, { status: 204 }); }
    if (method === 'POST' && !u.includes('upload')) {
      const meta = JSON.parse(init.body);
      const fid = `pasta${(driveSeq += 1)}xxxxxxxx`;
      driveFiles.set(fid, { id: fid, name: meta.name, folder: true });
      return new Response(JSON.stringify({ id: fid }));
    }
    const parts = String(init.body).split(/--b[0-9a-f]+/);
    const meta = JSON.parse(parts[1].split('\r\n\r\n')[1]);
    const content = parts[2].split('\r\n\r\n')[1].replace(/\r\n$/, '');
    const fid = id ? id.split('?')[0] : `arq${(driveSeq += 1)}xxxxxxxxxx`;
    driveFiles.set(fid, { id: fid, name: meta.name || driveFiles.get(fid)?.name, content });
    return new Response(JSON.stringify({ id: fid }));
  }
  return prevFetch(url, init);
};

{

await call('/drive/disconnect', {}, token);
check('Drive: desconectar apaga a autorização', (await call('/google/status', {}, token)).body.drive === null);
await call('/google/unlink', {}, token);
check('Google: desligar impede entrar com Google', (await call('/google/login', { credential: await idToken({}) })).status === 401);
window.fetch = prevFetch;

lines.push(`\nCron (no navegador, só referência): ${cronMs.toFixed(1)} ms no total, incluindo esperas`);
const failed = lines.filter((l) => l.startsWith('FALHA')).length;
document.title = failed ? `FALHOU ${failed}` : 'OK servidor';
document.getElementById('out').textContent = lines.join('\n');
</script>
</body>
