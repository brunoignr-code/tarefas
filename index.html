<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <!-- Política de segurança: só scripts do próprio app e do login do Google; o app só conversa com o servidor dele e com o Google. -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://accounts.google.com/gsi/client; style-src 'self' 'unsafe-inline' https://accounts.google.com/gsi/style; connect-src 'self' https://tarefas-sync.brunoignr-code.workers.dev https://accounts.google.com/gsi/; frame-src https://accounts.google.com/gsi/; img-src 'self' data: blob: https://*.googleusercontent.com https://*.gstatic.com; font-src 'self'; worker-src 'self'; manifest-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Minha lista de afazeres</title>
  <meta name="description" content="Gerenciador pessoal de tarefas que funciona offline.">
  <meta name="theme-color" content="#F3F8F3">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/favicon.svg" type="image/svg+xml">
  <link rel="icon" href="icons/favicon-32.png" sizes="32x32" type="image/png">
  <link rel="icon" href="icons/favicon-16.png" sizes="16x16" type="image/png">
  <link rel="apple-touch-icon" href="icons/icon-folha-192.png">
  <link rel="stylesheet" href="styles.css">
  <script src="js/boot.js"></script>
</head>
<body>
  <div class="splash" id="splash" role="img" aria-label="Minha lista de afazeres">
    <img src="icons/icon-folha.svg" alt="" width="168" height="168">
    <div><span class="s1">Minha lista de</span><span class="s2">afazeres</span><span class="s3">cada dia, uma folha nova</span></div>
  </div>
  <script src="js/splash.js"></script>
  <div class="app">
    <nav class="nav" id="nav" aria-label="Navegação principal"></nav>
    <main class="main">
      <div id="reminders"></div>
      <div id="view"></div>
    </main>
  </div>
  <dialog id="dialog"></dialog>
  <div id="toast" class="toast" role="status" hidden></div>
  <script type="module" src="js/app.js"></script>
</body>
</html>
